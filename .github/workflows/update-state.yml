name: Update State

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate state.json
        run: node scripts/generate-state.cjs

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/state.json
          git diff --staged --quiet || (git commit -m "chore: state update $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)