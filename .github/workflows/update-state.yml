name: Update State
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-state
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate state.json
        run: node scripts/generate-state.cjs

      - name: Fetch headlines
        run: node scripts/fetch-headlines.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/state.json public/headlines.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: state + headlines update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4